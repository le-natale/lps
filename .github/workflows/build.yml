name: Homologação - Pousada Villa Monte Verde

on:
  push:
    branches:
      - develop
    paths:
      - "sites/pousada-villa-monte-verde/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: pousada-villa-monte-verde-homologacao
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar homologação
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar arquivos e secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          test -f sites/pousada-villa-monte-verde/index.html
          test -f sites/pousada-villa-monte-verde/logo-villa-monte-verde-dourado.png
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          test -n "$FTP_PORT"

      - name: Deploy via FTP
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          local-dir: ./sites/pousada-villa-monte-verde/
          server-dir: ./lp/pousada-villa-monte-verde/
          state-name: .ftp-deploy-sync-pousada-villa-monte-verde.json

      - name: Testar página publicada
        run: |
          for attempt in 1 2 3 4 5; do
            if curl \
              --fail \
              --silent \
              --show-error \
              "https://fluxianexus.com.br/lp/pousada-villa-monte-verde/?deploy=${GITHUB_SHA}" |
              grep --fixed-strings --quiet "xxakuvahbt"; then
              echo "Homologação confirmada"
              exit 0
            fi

            echo "Tentativa $attempt sem confirmação"
            sleep 5
          done

          echo "Erro: a homologação não contém a versão esperada"
          exit 1
