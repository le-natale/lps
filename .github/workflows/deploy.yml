name: Produção - Pousada Villa Monte Verde

on:
  push:
    branches:
      - main
    paths:
      - "sites/pousada-villa-monte-verde/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: pousada-villa-monte-verde-producao
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Atualizar container lps-manutencao
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Validar arquivos e secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          test -f sites/pousada-villa-monte-verde/index.html
          test -f sites/pousada-villa-monte-verde/logo-villa-monte-verde-dourado.png
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_HOST_KEY"

      - name: Publicar arquivos
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          tar -C sites/pousada-villa-monte-verde -czf - . |
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            'docker exec -i lps-manutencao tar -xzf - -C /usr/share/nginx/html'

      - name: Testar página publicada
        run: |
          for attempt in 1 2 3 4 5; do
            if curl \
              --fail \
              --silent \
              --show-error \
              "https://lps.pousadavillamonteverde.com.br/?deploy=${GITHUB_SHA}" |
              grep --fixed-strings --quiet "xxakuvahbt"; then
              echo "Produção confirmada"
              exit 0
            fi

            echo "Tentativa $attempt sem confirmação"
            sleep 5
          done

          echo "Erro: a produção não contém a versão esperada"
          exit 1
